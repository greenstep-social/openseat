<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Загруженность комнат</title>
<style>
  :root {
    --bg: #eef1f6;
    --card-bg: #ffffff;
    --text: #14213d;
    --muted: #6b7280;
    --border: #e7e9ee;
    --accent: #f5943c;
    --quiet: #22c55e;
    --medium: #f59e0b;
    --loud: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem;
  }
  h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 1.25rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(20, 33, 61, 0.08);
    cursor: pointer;
    outline: 2px solid transparent;
    transition: outline-color 0.15s;
  }
  .card.selected { outline-color: var(--accent); }

  .photo-wrap {
    position: relative;
    height: 150px;
    background: #dde3ec;
    overflow: hidden;
  }
  .photo-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  .no-photo-placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 0.4rem; color: #94a3b8; font-size: 0.85rem;
  }
  .location-badge {
    position: absolute; left: 0.7rem; bottom: 0.7rem;
    background: rgba(20, 33, 61, 0.55);
    color: #fff; font-size: 0.75rem;
    padding: 0.3rem 0.6rem; border-radius: 999px;
    display: flex; align-items: center; gap: 0.3rem;
    backdrop-filter: blur(2px);
  }

  .card-body { padding: 1rem 1.1rem 1.1rem; }
  .title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.7rem; }

  .metric-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.45rem 0;
    border-top: 1px solid var(--border);
  }
  .metric-row:first-of-type { border-top: none; }
  .metric-label { font-size: 0.85rem; color: var(--muted); }

  .noise-badge {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.8rem; font-weight: 600;
    padding: 0.25rem 0.65rem; border-radius: 999px;
  }
  .noise-quiet  { background: rgba(34, 197, 94, 0.12);  color: #16803c; }
  .noise-medium { background: rgba(245, 158, 11, 0.14); color: #a05a04; }
  .noise-loud   { background: rgba(239, 68, 68, 0.12);  color: #b91c1c; }
  .noise-nodata { background: #eceef2; color: #6b7280; }
  .noise-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .occupancy-value { display: flex; align-items: center; gap: 0.6rem; }
  .bar-track {
    width: 110px; height: 8px; border-radius: 999px;
    background: #eceef2; overflow: hidden;
  }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .percent-text { font-size: 0.85rem; font-weight: 700; min-width: 2.4em; text-align: right; }

  .free-spots {
    margin-top: 0.5rem; font-size: 0.85rem; color: var(--muted);
    display: flex; align-items: center; gap: 0.4rem;
  }
  .status-line { margin-top: 0.5rem; font-size: 0.72rem; }
  .status-ok { color: #16803c; }
  .status-error { color: #b91c1c; }
  .status-nodata { color: var(--muted); }
  .no-data { color: var(--muted); font-style: italic; }

  .chart-section {
    margin-top: 1.75rem; background: var(--card-bg);
    border-radius: 18px; padding: 1.2rem 1.3rem;
    box-shadow: 0 1px 3px rgba(20, 33, 61, 0.08);
  }
  .chart-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1rem; font-size: 0.9rem;
  }
  select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 0.35rem 0.6rem; font-size: 0.85rem;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
  <h1>Загруженность комнат</h1>
  <div class="grid" id="grid">Загрузка...</div>

  <div class="chart-section">
    <div class="chart-header">
      <span>История: <b id="chartRoomLabel">—</b></span>
      <select id="hoursSelect">
        <option value="1">1 час</option>
        <option value="6">6 часов</option>
        <option value="24" selected>24 часа</option>
        <option value="168">7 дней</option>
      </select>
    </div>
    <canvas id="historyChart" height="90"></canvas>
    <div id="chartNoData" class="no-data" style="display:none; padding: 2rem 0; text-align: center;">
      Нет данных за выбранный период
    </div>
  </div>

  <div class="chart-section">
    <div class="chart-header">
      <span>Типичный день (8:00–22:00): <b id="dailyRoomLabel">—</b></span>
      <select id="weekdaySelect">
        <option value="all">Все дни</option>
        <option value="weekday" selected>Будни</option>
        <option value="weekend">Выходные</option>
      </select>
    </div>
    <canvas id="dailyChart" height="90"></canvas>
    <div id="dailyNoData" class="no-data" style="display:none; padding: 2rem 0; text-align: center;">
      Пока недостаточно истории для этого графика — накопится за несколько дней/недель работы
    </div>
  </div>

<script>
const BASE_URL = "http://localhost:8000"; // поменять на адрес сервера
let selectedRoom = null;
let chart = null;

const NOISE_LABELS = { quiet: "Тихо", medium: "Средне", loud: "Громко" };

function noiseBadgeHtml(category) {
  if (!category) {
    return `<span class="noise-badge noise-nodata"><span class="noise-dot"></span>Нет данных</span>`;
  }
  return `<span class="noise-badge noise-${category}">
            <span class="noise-dot"></span>${NOISE_LABELS[category] ?? category}
          </span>`;
}

function occupancyHtml(info) {
  if (info.occupancy_percent === null || info.occupancy_percent === undefined) {
    return `<span class="no-data">Нет данных</span>`;
  }
  return `
    <div class="occupancy-value">
      <div class="bar-track"><div class="bar-fill" style="width: ${info.occupancy_percent}%"></div></div>
      <span class="percent-text">${info.occupancy_percent}%</span>
    </div>`;
}

function statusLineHtml(status) {
  if (status === "ok") return { cls: "status-ok", text: "онлайн" };
  if (status === "starting" || !status) return { cls: "status-nodata", text: "Нет данных — сервер ещё не получил показания" };
  return { cls: "status-error", text: status };
}

async function refresh() {
  try {
    const res = await fetch(`${BASE_URL}/api/rooms`);
    const data = await res.json();
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    const roomIds = Object.keys(data.rooms);
    if (!selectedRoom && roomIds.length > 0) selectedRoom = roomIds[0];

    for (const [roomId, info] of Object.entries(data.rooms)) {
      const isSelected = roomId === selectedRoom;
      const photoUrl = `${BASE_URL}${info.photo_url}?t=${Date.now()}`;
      const status = statusLineHtml(info.occupancy_status);
      const hasFreeSpots = info.free_spots !== null && info.free_spots !== undefined;

      grid.innerHTML += `
        <div class="card ${isSelected ? 'selected' : ''}" onclick="selectRoom('${roomId}')">
          <div class="photo-wrap">
            <div class="no-photo-placeholder">📷 Нет данных</div>
            <img class="photo-img" src="${photoUrl}" alt="${roomId}" onerror="this.style.display='none'">
            <div class="location-badge">📍 ${roomId}</div>
          </div>
          <div class="card-body">
            <div class="title">${roomId}</div>

            <div class="metric-row">
              <span class="metric-label">Уровень громкости</span>
              ${noiseBadgeHtml(info.noise_category)}
            </div>

            <div class="metric-row">
              <span class="metric-label">Загруженность</span>
              ${occupancyHtml(info)}
            </div>

            <div class="free-spots">
              ${hasFreeSpots ? `👥 Свободно ${info.free_spots} мест` : `<span class="no-data">Нет данных о свободных местах</span>`}
            </div>

            <div class="status-line ${status.cls}">${status.text}</div>
          </div>
        </div>`;
    }
  } catch (e) {
    document.getElementById("grid").innerHTML = "Ошибка соединения с сервером";
  }
}

function selectRoom(roomId) {
  selectedRoom = roomId;
  refresh();
  refreshChart();
  refreshDailyChart();
}

async function refreshChart() {
  if (!selectedRoom) return;
  document.getElementById("chartRoomLabel").textContent = selectedRoom;
  const hours = document.getElementById("hoursSelect").value;
  const canvas = document.getElementById("historyChart");
  const noDataMsg = document.getElementById("chartNoData");

  try {
    const res = await fetch(`${BASE_URL}/api/occupancy/${selectedRoom}/history?hours=${hours}`);
    const data = await res.json();

    if (!data.readings || data.readings.length === 0) {
      canvas.style.display = "none";
      noDataMsg.style.display = "block";
      if (chart) { chart.destroy(); chart = null; }
      return;
    }
    canvas.style.display = "block";
    noDataMsg.style.display = "none";

    const labels = data.readings.map(r => new Date(r.timestamp).toLocaleTimeString());
    const values = data.readings.map(r => r.count);

    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.update();
    } else {
      const ctx = document.getElementById("historyChart").getContext("2d");
      chart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Людей в комнате",
            data: values,
            borderColor: "#f5943c",
            backgroundColor: "rgba(245, 148, 60, 0.12)",
            fill: true,
            tension: 0.2,
            stepped: true,
          }],
        },
        options: {
          responsive: true,
          scales: {
            x: { ticks: { color: "#6b7280", maxTicksLimit: 10 }, grid: { color: "#eceef2" } },
            y: { ticks: { color: "#6b7280", stepSize: 1 }, beginAtZero: true, grid: { color: "#eceef2" } },
          },
          plugins: { legend: { labels: { color: "#14213d" } } },
        },
      });
    }
  } catch (e) {
    console.error("Ошибка загрузки истории", e);
  }
}

let dailyChart = null;

async function refreshDailyChart() {
  if (!selectedRoom) return;
  document.getElementById("dailyRoomLabel").textContent = selectedRoom;
  const weekdayFilter = document.getElementById("weekdaySelect").value;
  const canvas = document.getElementById("dailyChart");
  const noDataMsg = document.getElementById("dailyNoData");

  try {
    const res = await fetch(`${BASE_URL}/api/occupancy/${selectedRoom}/daily_profile?days=30&weekday_filter=${weekdayFilter}`);
    const data = await res.json();

    const withData = data.profile.filter(p => p.samples > 0);
    if (withData.length === 0) {
      canvas.style.display = "none";
      noDataMsg.style.display = "block";
      if (dailyChart) { dailyChart.destroy(); dailyChart = null; }
      return;
    }
    canvas.style.display = "block";
    noDataMsg.style.display = "none";

    const labels = data.profile.map(p => `${String(p.hour).padStart(2, "0")}:00`);
    const avg = data.profile.map(p => p.avg);
    const p25 = data.profile.map(p => p.p25);
    const p75 = data.profile.map(p => p.p75);

    if (dailyChart) dailyChart.destroy();
    const ctx = canvas.getContext("2d");
    dailyChart = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: "75-й перцентиль",
            data: p75,
            borderColor: "transparent",
            backgroundColor: "rgba(245, 148, 60, 0.15)",
            pointRadius: 0,
            fill: "+1",
          },
          {
            label: "25-й перцентиль",
            data: p25,
            borderColor: "transparent",
            backgroundColor: "rgba(245, 148, 60, 0.15)",
            pointRadius: 0,
            fill: false,
          },
          {
            label: "Среднее",
            data: avg,
            borderColor: "#f5943c",
            backgroundColor: "rgba(245, 148, 60, 0.3)",
            pointRadius: 2,
            tension: 0.3,
            fill: false,
          },
        ],
      },
      options: {
        responsive: true,
        scales: {
          x: { ticks: { color: "#6b7280" }, grid: { color: "#eceef2" } },
          y: { ticks: { color: "#6b7280" }, beginAtZero: true, grid: { color: "#eceef2" } },
        },
        plugins: {
          legend: {
            labels: {
              color: "#14213d",
              filter: (item) => item.text === "Среднее", // не загромождаем легенду полосой
            },
          },
        },
      },
    });
  } catch (e) {
    console.error("Ошибка загрузки типичного дня", e);
  }
}

document.getElementById("hoursSelect").addEventListener("change", refreshChart);
document.getElementById("weekdaySelect").addEventListener("change", refreshDailyChart);

refresh().then(() => { refreshChart(); refreshDailyChart(); });
setInterval(refresh, 5000);       // обновление карточек (включая фото) раз в 5 сек
setInterval(refreshChart, 30000); // обновление графика истории раз в 30 сек
// "Типичный день" не обновляем так часто — раз в 5 минут достаточно,
// это агрегат за 30 дней, за 5 сек он не успевает заметно измениться
setInterval(refreshDailyChart, 5 * 60 * 1000);
</script>
</body>
</html>
