<!doctype html>
<html lang="ru" data-theme="dark">

  <meta name="theme-color" content="#11151e">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<body>
  <a class="skip-link" href="#app">Перейти к содержимому</a>

  <script>window.OPENSEAT_PREVIEW=true;</script>
